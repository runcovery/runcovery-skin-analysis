name: Backend CI

on:
  pull_request:
    branches:
      - develop
  push:
    branches:
      - develop

permissions:
  contents: read

concurrency:
  group: backend-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test and Build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      mariadb:
        image: mariadb:10.6
        env:
          MARIADB_ROOT_PASSWORD: root
          MARIADB_DATABASE: runcovery_ci
          MARIADB_USER: runcovery
          MARIADB_PASSWORD: runcovery
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mariadb-admin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    env:
      SPRING_DATASOURCE_URL: jdbc:mariadb://127.0.0.1:3306/runcovery_ci
      SPRING_DATASOURCE_USERNAME: runcovery
      SPRING_DATASOURCE_PASSWORD: runcovery

      SPRING_JPA_HIBERNATE_DDL_AUTO: create-drop
      SPRING_JPA_SHOW_SQL: "false"
      SPRING_SQL_INIT_MODE: always
      SPRING_JPA_DEFER_DATASOURCE_INITIALIZATION: "true"

      OPENWEATHER_API_KEY: ci-dummy-key
      SPRING_AI_OPENAI_API_KEY: ci-dummy-key
      SPRING_AI_OPENAI_CHAT_MODEL: gpt-4o-mini
      YOUTUBE_API_KEY: ci-dummy-key

      WELLNESS_SKIN_SCAN_URL: http://127.0.0.1:8000/scan
      WELLNESS_SKIN_SCAN_TIMEOUT: 30s

      SPRING_SERVLET_MULTIPART_MAX_FILE_SIZE: 10MB
      SPRING_SERVLET_MULTIPART_MAX_REQUEST_SIZE: 12MB

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Grant Gradle permission
        run: chmod +x gradlew

      - name: Configure MariaDB utf8mb4
        run: |
          docker exec "${{ job.services.mariadb.id }}" \
            mariadb -uroot -proot \
            -e "ALTER DATABASE runcovery_ci CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci;"

      - name: Test and build
        run: ./gradlew clean test bootJar --no-daemon

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-report
          path: build/reports/tests/test
          retention-days: 3

      - name: Upload executable JAR
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: runcovery-backend
          path: |
            build/libs/*.jar
            !build/libs/*-plain.jar
          retention-days: 3
